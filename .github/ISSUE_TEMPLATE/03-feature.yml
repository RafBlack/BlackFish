name: Feature request
description: Suggest a focused improvement to BlackFish.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe a concrete situation and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the result you want. Include privacy, permission, or offline-use implications when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: Mention current workarounds, simpler options, and how the change fits credential-phishing protection.
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I checked the README, documented limitations, and existing issues.
          required: true
