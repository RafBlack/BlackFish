name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  extension:
    name: Extension / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install extension dependencies
        run: npm ci
      - name: Run unit regressions
        run: npm test
      - name: Build unpacked extension
        run: npm run build

  browser:
    name: Chromium / regressions and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install extension dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run extension browser regressions
        run: npm run test:browser
      - name: Evaluate synthetic fixtures
        run: npm run evaluate
      - name: Evaluate form-branding promotion gate
        run: npm run evaluate:branding

  backend:
    name: Backend / tests and deployment dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install extension dependencies used by backend tests
        run: npm ci --prefix ..
      - name: Install backend tooling
        run: npm ci
      - name: Run backend regressions
        run: npm test
      - name: Validate Worker bundle without deploying
        run: npm run deploy:check
