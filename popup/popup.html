<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="">
    <h1>BlackFish</h1>
    <button id="settingsBtn" title="Options">⚙</button>
  </header>

  <div id="verdict" class="verdict low">
    <div class="score-ring"><span id="scoreNum">—</span></div>
    <div class="verdict-text">
      <div id="levelLabel">Checking…</div>
      <div id="hostLabel" class="host"></div>
    </div>
  </div>

  <ul id="reasonList"></ul>
  <p id="emptyState" class="empty">No suspicious signals on this page.</p>

  <div class="actions">
    <button id="rescanBtn">Rescan page</button>
    <button id="trustBtn">Trust this site</button>
  </div>

  <footer>Heuristics run locally on this device. <span id="aiNote"></span></footer>

  <script src="popup.js"></script>
</body>
</html>
